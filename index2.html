<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>랜딩 페이지</title>
    <link rel="stylesheet" href="landing.css">
</head>
<body>
    <main class="wrap" aria-label="랜딩 페이지 섹션">
        <section class="landing-section landing-section--intro" aria-labelledby="intro-title">
            <div class="section-content">
                <p class="section-kicker">WELCOME</p>
                <h1 id="intro-title">새로운 시작</h1>
                <p class="section-description">아래로 스크롤해 더 알아보세요.</p>
                <span class="scroll-hint" aria-hidden="true">SCROLL ↓</span>
            </div>
        </section>
        <section class="landing-section landing-section--profile" aria-labelledby="profile-title">
            <div class="section-content">
                <p class="section-kicker">ABOUT</p>
                <h2 id="profile-title">프로필</h2>
                <p class="section-description">이곳에 소개와 프로필 내용을 추가해 보세요.</p>
                <span class="section-number" aria-hidden="true">02</span>
            </div>
        </section>
        <section class="landing-section landing-section--session" aria-labelledby="session-title">
            <div class="section-content">
                <p class="section-kicker">EXPLORE</p>
                <h2 id="session-title">세션</h2>
                <p class="section-description">마지막 섹션입니다. 위로 스크롤해 다시 둘러보세요.</p>
                <span class="section-number" aria-hidden="true">03</span>
            </div>
        </section>
    </main>
    <script src="landing.js"></script>
</body>
</html>
