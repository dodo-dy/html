<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>랜딩 페이지</title>
    <link rel="stylesheet" href="landing.css">
</head>
<body>
    <main class="wrap" aria-label="랜딩 페이지 섹션">
        <section class="landing-section landing-section--intro" aria-labelledby="intro-title">
            <div class="section-content">
                <p class="section-kicker">WELCOME</p>
                <h1 id="intro-title">새로운 시작</h1>
            </div>
        </section>
        <section id="work" class="landing-section landing-section--work" aria-labelledby="work-title">
            <div class="section-content work-content">
                <p class="section-kicker">WORK</p>
                <h2 id="work-title">주요 작업</h2>
                <ul class="work-list">
                    <li><h3>상세페이지</h3></li>
                    <li><h3>디자인 리뉴얼</h3></li>
                    <li><h3>프리미어 편집작업</h3></li>
                    <li><h3>애프터 이펙트 모션작업</h3></li>
                </ul>
            </div>
        </section>
        <section class="landing-section landing-section--session" aria-labelledby="session-title">
            <div class="section-content">
                <p class="section-kicker">EXPLORE</p>
                <h2 id="session-title">세션</h2>
            </div>
        </section>
    </main>
    <script src="landing.js"></script>
</body>
</html>
